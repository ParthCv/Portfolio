<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#04050f"/>
  <g transform="translate(16 16)" fill="none" stroke="#7b6fff" stroke-width="1.6" stroke-linecap="round">
    <!-- 6 petals radiating out -->
    <g>
      <ellipse cx="0" cy="-7" rx="3" ry="6"/>
    </g>
    <g transform="rotate(60)">
      <ellipse cx="0" cy="-7" rx="3" ry="6"/>
    </g>
    <g transform="rotate(120)">
      <ellipse cx="0" cy="-7" rx="3" ry="6"/>
    </g>
    <g transform="rotate(180)">
      <ellipse cx="0" cy="-7" rx="3" ry="6"/>
    </g>
    <g transform="rotate(240)">
      <ellipse cx="0" cy="-7" rx="3" ry="6"/>
    </g>
    <g transform="rotate(300)">
      <ellipse cx="0" cy="-7" rx="3" ry="6"/>
    </g>
  </g>
  <circle cx="16" cy="16" r="2.4" fill="#7b6fff"/>
</svg>
